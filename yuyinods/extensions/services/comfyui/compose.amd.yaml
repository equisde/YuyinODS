services:
  comfyui:
    build:
      context: ./extensions/services/comfyui
      dockerfile: Dockerfile.amd
    image: ${COMFYUI_AMD_IMAGE:-yuyinods-comfyui-rocm:latest}
    container_name: yuyinods-comfyui
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    shm_size: 8g
    environment:
      - HSA_OVERRIDE_GFX_VERSION=${COMFYUI_AMD_HSA_OVERRIDE_GFX_VERSION:-}
      - HSA_ENABLE_SDMA=0
    volumes:
      - ${YUYINODS_MODELS_DIR:-/home/parallax/ODS/models}:/models:ro,z
      - ./data/comfyui/output:/output:z
      - ./data/comfyui/input:/input:z
      - ./data/comfyui/workflows:/workflows:ro,z
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${COMFYUI_PORT:-8188}:8188"
    command: ${COMFYUI_AMD_COMMAND:-}
    deploy:
      resources:
        limits:
          cpus: '${COMFYUI_CPU_LIMIT:-2.0}'
          memory: ${COMFYUI_MEMORY_LIMIT:-24G}
        reservations:
          cpus: '${COMFYUI_CPU_RESERVATION:-0.5}'
          memory: ${COMFYUI_MEMORY_RESERVATION:-4G}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8188"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: ${COMFYUI_START_PERIOD:-300s}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
